<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compoter</title>
<meta name="description" content="Book on-demand IT support — a verified engineer comes to you.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F8F9FC; --paper-raised:#FFFFFF; --ink:#16162B;
    --indigo:#3730A3; --indigo-deep:#211D5C; --indigo-soft:#EDECFB;
    --teal:#14B8A6; --teal-deep:#0D9488;
    --steel:#5A5A72; --steel-light:#8E8EA3; --line:#E4E4F0;
    --display:'Space Grotesk', sans-serif; --body:'Inter', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--paper); color:var(--ink); font-family:var(--body); line-height:1.5; visibility:hidden;}
  a{color:inherit; text-decoration:none;}
  h1,h2{font-family:var(--display); font-weight:700;}

  .location-bar{
    background:var(--indigo); color:#fff; padding:18px 20px 22px;
    border-radius:0 0 20px 20px;
  }
  .location-bar .label{font-size:11px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; color:#C6C2ED;}
  .location-bar .value{
    display:flex; align-items:center; gap:6px; font-size:15px; font-weight:700; margin-top:4px; cursor:pointer;
  }
  .location-bar .value .chev{font-size:11px; opacity:0.8;}

  .search-wrap{ padding:0 20px; margin-top:-16px; }
  .search-box{
    background:#fff; border-radius:12px; box-shadow:0 8px 24px rgba(55,48,163,0.14);
    display:flex; align-items:center; gap:10px; padding:13px 16px;
  }
  .search-box input{
    border:none; outline:none; flex:1; font-family:var(--body); font-size:14px; color:var(--ink);
  }

  .banner{
    margin:20px; border-radius:16px; padding:22px;
    background:linear-gradient(135deg, var(--indigo), var(--indigo-deep)); color:#fff;
  }
  .banner .eyebrow{font-size:11px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; color:#B4B0E8;}
  .banner h2{font-size:19px; margin:6px 0 4px;}
  .banner p{font-size:13px; color:rgba(255,255,255,0.85);}
  .banner a{
    display:inline-block; margin-top:12px; background:var(--teal); color:#fff; font-weight:600;
    font-size:13px; padding:9px 16px; border-radius:8px;
  }

  .section-title{padding:0 20px; margin:24px 0 12px; font-size:15px; font-weight:700;}

  .category-grid{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; padding:0 20px 24px;
  }
  .category-tile{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:14px; padding:16px 10px;
    display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center;
  }
  .category-tile .icon-badge{
    width:44px; height:44px; border-radius:12px; background:var(--indigo-soft);
    display:flex; align-items:center; justify-content:center;
  }
  .category-tile .icon-badge svg{width:22px; height:22px; stroke:var(--indigo);}
  .category-tile .cat-name{font-size:12px; font-weight:600; line-height:1.3;}
  .category-tile .cat-price{font-size:10.5px; color:var(--steel-light); margin-top:-2px;}

  .empty-search{padding:40px 20px; text-align:center; color:var(--steel-light); font-size:13.5px;}
</style>
</head>
<body>

<script type="module">
  // Auth gate: app-home.html is the app's landing screen, so check login
  // status before anything else — first-time users get sent to sign in /
  // sign up; returning users (Firebase persists the session) fall straight
  // through to the home screen below.
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA80s9jtewt93rsveqQyXD2xslm1chJuME",
    authDomain: "expertinc-tools.firebaseapp.com",
    projectId: "expertinc-tools",
    storageBucket: "expertinc-tools.firebasestorage.app",
    messagingSenderId: "86282664413",
    appId: "1:86282664413:web:ec3374c7ffe1d99e70de34"
  };

  // Same named app as customer-login.html so the login session is shared.
  const authApp = initializeApp(firebaseConfig, "compoter-customer");
  const auth = getAuth(authApp);

  onAuthStateChanged(auth, (user) => {
    if (!user) {
      window.location.replace('customer-login.html');
      return;
    }
    document.body.style.visibility = 'visible';
  });
</script>

<div class="location-bar">
  <div class="label">Service Location</div>
  <div class="value" id="location-value">📍 Fetching your location…<span class="chev">▾</span></div>
</div>

<div class="search-wrap">
  <div class="search-box">
    <span>🔍</span>
    <input type="text" id="search-input" placeholder="Search for a service...">
  </div>
</div>

<div class="banner">
  <div class="eyebrow">On-Demand IT Support</div>
  <h2>A verified engineer comes to you.</h2>
  <p>Computer repair, networking, CCTV, servers &amp; more — book in under a minute.</p>
  <a href="booking.html">Book a Service →</a>
</div>

<div class="section-title">All Services</div>
<div class="category-grid" id="category-grid"></div>
<div class="empty-search" id="empty-search" style="display:none;">Koi service nahi mili.</div>

<script>
  const SERVICES = [
    { value: 'Computer', name: 'Computer &amp; Laptop Repair', price: '₹599', icon: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14" rx="1.5"/><rect x="9" y="9" width="6" height="6" rx="0.5"/><path d="M12 2 V5 M12 19 V22 M2 12 H5 M19 12 H22"/></svg>' },
    { value: 'Printer', name: 'Printer Repair', price: '₹599', icon: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="6" width="16" height="10" rx="1.5"/><path d="M8 20 H16 M12 16 V20"/></svg>' },
    { value: 'CCTV', name: 'CCTV Installation', price: '₹499/cam', icon: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="13" height="9" rx="1.5"/><path d="M16 10 L21 7 V16 L16 13"/></svg>' },
    { value: 'Networking', name: 'Networking &amp; WiFi', price: '₹799', icon: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.2"/><circle cx="18" cy="6" r="2.2"/><circle cx="12" cy="18" r="2.2"/><path d="M7.5 7.5 L11 16.5 M16.5 7.5 L13 16.5 M8 6 H16"/></svg>' },
    { value: 'Server', name: 'Server Support', price: '₹1,499', icon: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="6" rx="1"/><rect x="4" y="14" width="16" height="6" rx="1"/><circle cx="8" cy="7" r="0.8" fill="currentColor" stroke="none"/><circle cx="8" cy="17" r="0.8" fill="currentColor" stroke="none"/></svg>' },
    { value: 'NAS', name: 'NAS Installation', price: '₹1,499', icon: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7.5" ry="2.4"/><path d="M4.5 6 V18 C4.5 19.3 7.9 20.4 12 20.4 C16.1 20.4 19.5 19.3 19.5 18 V6"/><path d="M4.5 12 C4.5 13.3 7.9 14.4 12 14.4 C16.1 14.4 19.5 13.3 19.5 12"/></svg>' },
    { value: 'Firewall', name: 'Firewall Setup', price: '₹1,999', icon: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 L20 5.5 V11 C20 16 16.5 19.5 12 21 C7.5 19.5 4 16 4 11 V5.5 Z"/><path d="M8.5 12 L11 14.5 L15.5 9"/></svg>' },
    { value: 'AMC', name: 'Office IT AMC', price: '₹2,999/mo', icon: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11 L12 14 L20 6"/><path d="M20 12 V17 A2 2 0 0 1 18 19 H6 A2 2 0 0 1 4 17 V7 A2 2 0 0 1 6 5 H15"/></svg>' },
    { value: 'Home', name: 'Home IT Support', price: '₹599', icon: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12 L5 12 L7 6 L11 18 L14 9 L16 12 L21 12"/></svg>' },
    { value: 'DataRecovery', name: 'Data Recovery', price: '₹999', icon: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12 C4 7.5 7.5 4 12 4 C16.5 4 20 7.5 20 12"/><path d="M4 12 L4 16 M20 12 L20 16"/><path d="M4 16 C4 18 6 19 8 18 M20 16 C20 18 18 19 16 18"/></svg>' },
  ];

  const grid = document.getElementById('category-grid');
  const emptyEl = document.getElementById('empty-search');

  function renderGrid(list){
    if (!list.length) {
      grid.innerHTML = '';
      emptyEl.style.display = 'block';
      return;
    }
    emptyEl.style.display = 'none';
    grid.innerHTML = list.map(s => `
      <a class="category-tile" href="booking.html?service=${encodeURIComponent(s.value)}">
        <div class="icon-badge">${s.icon}</div>
        <div class="cat-name">${s.name}</div>
        <div class="cat-price">${s.price}</div>
      </a>
    `).join('');
  }
  renderGrid(SERVICES);

  document.getElementById('search-input').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    renderGrid(q ? SERVICES.filter(s => s.name.toLowerCase().includes(q)) : SERVICES);
  });

  // ---------- Location bar ----------
  const locationValueEl = document.getElementById('location-value');

  async function reverseGeocode(lat, lng){
    try {
      const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=14`, {
        headers: { 'Accept-Language': 'en' }
      });
      const data = await res.json();
      const a = data.address || {};
      return a.suburb || a.neighbourhood || a.city_district || a.city || a.town || a.village || data.display_name || null;
    } catch (e) {
      console.error('reverse geocode failed', e);
      return null;
    }
  }

  function setLocationText(text){
    locationValueEl.innerHTML = '📍 ' + text + '<span class="chev">▾</span>';
  }

  if (!navigator.geolocation) {
    setLocationText('Location not available — tap to enter manually');
  } else {
    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        const name = await reverseGeocode(pos.coords.latitude, pos.coords.longitude);
        setLocationText(name || 'Current location');
      },
      () => setLocationText('Tap to set your location'),
      { timeout: 10000 }
    );
  }

  locationValueEl.addEventListener('click', () => {
    const manual = prompt('Apna area/city likho:');
    if (manual && manual.trim()) setLocationText(manual.trim());
  });
</script>

<script src="capacitor-back.js"></script>
<script src="app-tabs.js"></script>
</body>
</html>
