<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — Compoter</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F8F9FC; --paper-raised:#FFFFFF; --ink:#101820;
    --indigo:#3730A3; --indigo-deep:#211D5C; --indigo-soft:#EDECFB;
    --teal:#14B8A6; --red:#D6362C; --amber:#B45309;
    --steel:#57677A; --steel-light:#8A96A3; --line:#E2E6E4;
    --display:'Space Grotesk', sans-serif; --body:'Inter', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: radial-gradient(1100px 520px at 50% -12%, #E4E2FA 0%, rgba(228,226,250,0) 60%), var(--paper);
    background-attachment: fixed;
    color:var(--ink); font-family:var(--body); line-height:1.5; visibility:hidden;
  }
  a{color:inherit; text-decoration:none;}
  h1{font-family:var(--display); font-weight:700;}

  .top{background:var(--indigo-deep); color:#fff; padding:22px 20px 28px;}
  .top h1{font-size:19px;}
  .avatar-wrap{position:relative; width:64px; height:64px; margin-bottom:12px;}
  .avatar{
    width:64px; height:64px; border-radius:50%; background:var(--teal); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:700;
    overflow:hidden;
  }
  .avatar img{width:100%; height:100%; object-fit:cover;}
  .avatar-edit-btn{
    position:absolute; bottom:-2px; right:-2px; width:24px; height:24px; border-radius:50%;
    background:#fff; border:none; display:flex; align-items:center; justify-content:center;
    font-size:12px; cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,0.3);
  }
  .top .name{font-size:17px; font-weight:700;}
  .top .phone{font-size:13px; color:#C6C2ED; margin-top:2px;}

  .wrap{padding:20px;}
  .card{background:var(--paper-raised); border:1px solid var(--line); border-radius:14px; overflow:hidden; margin-bottom:16px;}
  .row{
    display:flex; align-items:center; justify-content:space-between; padding:14px 18px;
    border-bottom:1px solid var(--line); font-size:14px; font-weight:600; cursor:default;
  }
  .row:last-child{border-bottom:none;}
  .row.editable{cursor:pointer;}
  .row .label-col{display:flex; flex-direction:column; gap:2px;}
  .row .val{font-size:12.5px; font-weight:500; color:var(--steel);}
  .row .val.required{color:var(--amber);}
  .row .val.link{color:var(--indigo); font-weight:600;}
  .row .chev{color:var(--steel-light); font-size:16px;}

  .btn-signout{
    width:100%; background:#fff; border:1.5px solid var(--red); color:var(--red);
    font-weight:600; font-size:14px; padding:13px; border-radius:10px; cursor:pointer;
  }
</style>
</head>
<body>

<div class="top">
  <div class="avatar-wrap">
    <div class="avatar" id="avatar-circle"><span id="avatar-initial">?</span><img id="avatar-photo" style="display:none;"></div>
    <button class="avatar-edit-btn" id="avatar-edit-btn" type="button" title="Change photo">📷</button>
  </div>
  <input type="file" id="photo-input" accept="image/*" style="display:none;">
  <div class="name" id="acc-name">Loading…</div>
  <div class="phone" id="acc-phone"></div>
</div>

<div class="wrap">
  <div class="card">
    <div class="row editable" data-field="name">
      <span class="label-col">👤 Name<span class="val" id="f-name">—</span></span>
      <span class="chev">›</span>
    </div>
    <div class="row">
      <span class="label-col">📞 Phone Number<span class="val" id="f-phone">—</span></span>
    </div>
    <div class="row editable" data-field="email">
      <span class="label-col">✉️ Email<span class="val" id="f-email">Required</span></span>
      <span class="chev">›</span>
    </div>
    <div class="row editable" data-field="gender">
      <span class="label-col">⚧ Gender<span class="val" id="f-gender">Required</span></span>
      <span class="chev">›</span>
    </div>
    <div class="row editable" data-field="dob">
      <span class="label-col">🎂 Date of Birth<span class="val" id="f-dob">Required</span></span>
      <span class="chev">›</span>
    </div>
    <div class="row">
      <span class="label-col">🏅 Member Since<span class="val" id="f-member-since">—</span></span>
    </div>
    <div class="row editable" data-field="emergencyContact">
      <span class="label-col">🚨 Emergency Contact<span class="val" id="f-emergency">Required</span></span>
      <span class="chev">›</span>
    </div>
  </div>

  <div class="card" id="referral-card">
    <div class="row">
      <span class="label-col">🎁 Refer &amp; Earn<span class="val" id="f-referral-code">—</span></span>
      <button type="button" id="share-referral-btn" style="background:var(--indigo-soft); color:var(--indigo); border:none; border-radius:7px; padding:8px 14px; font-weight:600; font-size:13px; cursor:pointer;">Share</button>
    </div>
    <div class="row">
      <span class="label-col">💰 Wallet Credit<span class="val" id="f-wallet">₹0</span></span>
    </div>
  </div>

  <div class="card">
    <a class="row" href="customer-login.html"><span>📋 My Bookings</span><span class="chev">›</span></a>
    <a class="row" href="booking.html"><span>➕ Book a New Service</span><span class="chev">›</span></a>
    <a class="row" href="contact.html"><span>💬 Help &amp; Support</span><span class="chev">›</span></a>
    <div class="row" id="rate-app-row" style="cursor:pointer;"><span>⭐ Rate the App</span><span class="chev">›</span></div>
  </div>

  <button class="btn-signout" id="signout-btn">Sign Out</button>
</div>

<div id="rate-app-overlay" style="display:none; position:fixed; inset:0; z-index:10000; background:rgba(16,17,29,0.55); align-items:center; justify-content:center; padding:20px;">
  <div style="background:#fff; border-radius:16px; max-width:360px; width:100%; padding:26px 24px; text-align:center;">
    <h2 style="font-family:var(--display); font-size:18px; margin-bottom:14px;">Compoter App ko rate karo</h2>
    <div id="rate-app-stars" style="display:flex; justify-content:center; gap:6px; margin-bottom:14px;">
      <span class="app-star" data-value="1" style="font-size:30px; cursor:pointer; color:var(--line);">★</span>
      <span class="app-star" data-value="2" style="font-size:30px; cursor:pointer; color:var(--line);">★</span>
      <span class="app-star" data-value="3" style="font-size:30px; cursor:pointer; color:var(--line);">★</span>
      <span class="app-star" data-value="4" style="font-size:30px; cursor:pointer; color:var(--line);">★</span>
      <span class="app-star" data-value="5" style="font-size:30px; cursor:pointer; color:var(--line);">★</span>
    </div>
    <textarea id="rate-app-review" placeholder="Feedback likho (optional)" style="width:100%; border:1px solid var(--line); border-radius:8px; padding:10px; font-family:var(--body); font-size:13.5px; resize:vertical; min-height:60px; margin-bottom:14px;"></textarea>
    <div style="display:flex; gap:10px;">
      <button type="button" id="rate-app-cancel" style="flex:1; background:#fff; border:1.5px solid var(--line); color:var(--steel); font-weight:600; padding:11px; border-radius:8px; cursor:pointer;">Cancel</button>
      <button type="button" id="rate-app-submit" style="flex:1; background:var(--indigo); border:none; color:#fff; font-weight:600; padding:11px; border-radius:8px; cursor:pointer;">Submit</button>
    </div>
  </div>
</div>

<input type="date" id="dob-input" style="position:absolute; opacity:0; pointer-events:none; width:1px; height:1px;">

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signOut, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { initializeFirestore, doc, getDoc, setDoc, addDoc, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA80s9jtewt93rsveqQyXD2xslm1chJuME",
    authDomain: "expertinc-tools.firebaseapp.com",
    projectId: "expertinc-tools",
    storageBucket: "expertinc-tools.firebasestorage.app",
    messagingSenderId: "86282664413",
    appId: "1:86282664413:web:ec3374c7ffe1d99e70de34"
  };

  // Same named app as customer-login.html so the login session is shared.
  const app = initializeApp(firebaseConfig, "compoter-customer");
  const auth = getAuth(app);
  await setPersistence(auth, browserLocalPersistence);
  const db = initializeFirestore(app, { experimentalAutoDetectLongPolling: true });
  const storage = getStorage(app);

  document.getElementById('signout-btn').addEventListener('click', () => signOut(auth));

  let currentUser = null;
  let profile = {};

  function fmtMemberSince(createdAt){
    if (!createdAt) return '—';
    const d = new Date(createdAt);
    if (isNaN(d)) return '—';
    return d.toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });
  }

  function setRow(id, value, opts = {}){
    const el = document.getElementById(id);
    if (value) {
      el.textContent = value;
      el.classList.remove('required');
    } else {
      el.textContent = opts.linkText || 'Required';
      el.classList.add('required');
    }
  }

  function renderProfile(){
    document.getElementById('acc-name').textContent = profile.name || currentUser.phoneNumber || 'Compoter Customer';
    document.getElementById('acc-phone').textContent = currentUser.phoneNumber || '';
    setRow('f-name', profile.name);
    setRow('f-email', profile.email);
    setRow('f-gender', profile.gender);
    setRow('f-dob', profile.dob);
    setRow('f-emergency', profile.emergencyContact);
    document.getElementById('f-phone').textContent = currentUser.phoneNumber || '—';
    document.getElementById('f-member-since').textContent = fmtMemberSince(profile.createdAt);
    document.getElementById('f-referral-code').textContent = profile.referralCode || '—';
    document.getElementById('f-wallet').textContent = '₹' + Number(profile.walletCredit || 0).toLocaleString('en-IN');

    const initialEl = document.getElementById('avatar-initial');
    const photoEl = document.getElementById('avatar-photo');
    if (profile.photoURL) {
      photoEl.src = profile.photoURL;
      photoEl.style.display = 'block';
      initialEl.style.display = 'none';
    } else {
      photoEl.style.display = 'none';
      initialEl.style.display = 'block';
      initialEl.textContent = (profile.name || '?').trim().charAt(0).toUpperCase() || '?';
    }
  }

  async function saveField(field, value){
    await setDoc(doc(db, 'customers', currentUser.uid), { [field]: value }, { merge: true });
    profile[field] = value;
    renderProfile();
  }

  document.querySelectorAll('.row.editable').forEach(row => {
    row.addEventListener('click', () => {
      const field = row.dataset.field;
      if (field === 'dob') {
        document.getElementById('dob-input').showPicker
          ? document.getElementById('dob-input').showPicker()
          : document.getElementById('dob-input').click();
        return;
      }
      const label = field === 'emergencyContact' ? 'Emergency contact number'
        : field === 'gender' ? 'Gender (Male / Female / Other)'
        : field.charAt(0).toUpperCase() + field.slice(1);
      const value = prompt(label + ' likhein:', profile[field] || '');
      if (value === null) return;
      const trimmed = value.trim();
      if (!trimmed) return;
      saveField(field, trimmed);
    });
  });

  // ---------- Rate the App ----------
  let appRatingValue = 0;
  const rateAppOverlay = document.getElementById('rate-app-overlay');

  document.getElementById('rate-app-row').addEventListener('click', () => {
    appRatingValue = 0;
    document.querySelectorAll('.app-star').forEach(s => s.style.color = 'var(--line)');
    document.getElementById('rate-app-review').value = '';
    rateAppOverlay.style.display = 'flex';
  });

  document.getElementById('rate-app-cancel').addEventListener('click', () => {
    rateAppOverlay.style.display = 'none';
  });

  document.querySelectorAll('.app-star').forEach(star => {
    star.addEventListener('click', () => {
      appRatingValue = Number(star.dataset.value);
      document.querySelectorAll('.app-star').forEach(s => {
        s.style.color = Number(s.dataset.value) <= appRatingValue ? '#F5A623' : 'var(--line)';
      });
    });
  });

  document.getElementById('rate-app-submit').addEventListener('click', async () => {
    if (!appRatingValue) { alert('Pehle stars par tap karo.'); return; }
    const btn = document.getElementById('rate-app-submit');
    btn.disabled = true;
    btn.textContent = 'Submitting...';
    try {
      await addDoc(collection(db, 'appReviews'), {
        name: profile.name || currentUser.phoneNumber || 'Compoter Customer',
        rating: appRatingValue,
        review: document.getElementById('rate-app-review').value.trim(),
        createdAt: serverTimestamp()
      });
      rateAppOverlay.style.display = 'none';
      alert('Dhanyawad! Aapka feedback mil gaya.');
    } catch (err) {
      console.error('app rating failed', err);
      alert('Kuch gadbad ho gayi (' + (err.code || err.message) + ').');
    }
    btn.disabled = false;
    btn.textContent = 'Submit';
  });

  document.getElementById('dob-input').addEventListener('change', (e) => {
    if (e.target.value) saveField('dob', e.target.value);
  });

  document.getElementById('share-referral-btn').addEventListener('click', () => {
    const code = profile.referralCode;
    if (!code) return;
    const text = `Compoter par IT support book karo — mera referral code use karo "${code}" aur pehli booking par 10% off pao!\n\nhttps://compoter.in`;
    if (navigator.share) {
      navigator.share({ text }).catch(() => {});
    } else {
      window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
    }
  });

  document.getElementById('avatar-edit-btn').addEventListener('click', () => {
    document.getElementById('photo-input').click();
  });

  document.getElementById('photo-input').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) { alert('Photo 5MB se chhoti honi chahiye.'); return; }
    try {
      const photoRef = ref(storage, `profile-photos/customer/${currentUser.uid}`);
      await uploadBytes(photoRef, file);
      const url = await getDownloadURL(photoRef);
      await saveField('photoURL', url);
    } catch (err) {
      console.error('photo upload failed', err);
      alert('Photo upload nahi ho paya (' + (err.code || err.message) + ').');
    }
  });

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.replace('customer-login.html');
      return;
    }
    currentUser = user;
    document.body.style.visibility = 'visible';
    try {
      const snap = await getDoc(doc(db, 'customers', user.uid));
      profile = snap.exists() ? snap.data() : {};
      renderProfile();
    } catch (err) {
      console.error('profile lookup failed', err);
      document.getElementById('acc-name').textContent = user.phoneNumber || 'Compoter Customer';
    }
  });
</script>

<script src="capacitor-back.js"></script>
<script src="app-tabs.js"></script>
</body>
</html>
