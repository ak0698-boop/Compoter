<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account — Compoter</title>
<meta name="description" content="Sign in or create an account to track all your Compoter bookings in one place.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    --paper:#F8F9FC; --paper-raised:#FFFFFF; --ink:#101820;
    --indigo:#3730A3; --indigo-deep:#211D5C; --indigo-soft:#EDECFB;
    --teal:#14B8A6; --mint:#1F8A70; --red:#D6362C; --amber:#B45309; --amber-soft:#FEF3C7;
    --steel:#57677A; --steel-light:#8A96A3; --line:#E2E6E4;
    --display:'Space Grotesk', sans-serif; --body:'Inter', sans-serif; --mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: radial-gradient(1100px 520px at 50% -12%, #E4E2FA 0%, rgba(228,226,250,0) 60%), var(--paper);
    background-attachment: fixed;
    color:var(--ink); font-family:var(--body); line-height:1.5; visibility:hidden;
  }
  a{color:inherit; text-decoration:none;}
  h1,h2{font-family:var(--display); font-weight:700;}

  .top{background:var(--indigo-deep); color:#fff; padding:16px 28px; display:flex; align-items:center; justify-content:space-between;}
  .top .logo{font-family:var(--display); font-weight:700; font-size:17px; display:flex; align-items:center; gap:10px;}
  .top .logo .mark{width:26px; height:26px; background:var(--teal); border-radius:6px;}
  .top .who{font-size:13px; color:#C6C2ED; display:flex; align-items:center; gap:14px;}
  .top button{background:rgba(255,255,255,0.12); color:#fff; border:none; padding:8px 14px; border-radius:7px; cursor:pointer; font-size:13px; font-weight:600;}
  .top button:hover{background:rgba(255,255,255,0.22);}

  .wrap{max-width:720px; margin:0 auto; padding:0 24px;}

  /* AUTH */
  #auth-view{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  .auth-card{background:var(--paper-raised); border:1px solid var(--line); border-radius:14px; padding:36px; width:100%; max-width:400px;}
  .auth-card h1{font-size:22px; margin-bottom:6px;}
  .auth-card p.sub{color:var(--steel); font-size:13.5px; margin-bottom:22px;}
  .field{margin-bottom:14px;}
  .field label{font-size:13px; font-weight:600; display:block; margin-bottom:6px;}
  .field input{
    width:100%; background:var(--paper); border:1.5px solid var(--line); border-radius:8px; padding:11px 13px;
    font-family:var(--body); font-size:14px; color:var(--ink); outline:none;
  }
  .field input:focus{border-color:var(--indigo);}
  .phone-row{display:flex; gap:8px;}
  .phone-prefix{
    padding:11px 13px; background:var(--paper); border:1.5px solid var(--line); border-radius:8px;
    font-weight:600; font-size:14px; display:flex; align-items:center;
  }
  .btn{
    font-family:var(--body); font-weight:600; font-size:14.5px; padding:12px 20px; border-radius:8px;
    cursor:pointer; border:none; width:100%; background:var(--teal); color:#fff;
  }
  .btn:hover{background:#0D9488;}
  .btn:disabled{opacity:0.6; cursor:not-allowed;}
  .msg{font-size:13px; margin-top:12px; padding:10px 12px; border-radius:7px; display:none;}
  .msg.show{display:block;}
  .msg.err{background:#FBE9E7; color:var(--red);}
  .change-link{display:block; text-align:center; margin-top:14px; font-size:13px; color:var(--indigo); font-weight:600;}

  /* DASHBOARD */
  #dashboard-view{display:none;}
  .job-card{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:14px; padding:22px; margin-bottom:16px;
  }
  .job-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; gap:8px;}
  .job-id{font-family:var(--mono); font-weight:700; font-size:14px; color:var(--indigo);}
  .badge{display:inline-block; font-size:11px; font-weight:700; padding:4px 11px; border-radius:100px; text-transform:capitalize;}
  .badge.assigned{background:var(--indigo-soft); color:var(--indigo);}
  .badge.on_the_way{background:#FEF3C7; color:var(--amber);}
  .badge.in_progress{background:#E0F2FE; color:#0369A1;}
  .badge.completed{background:#E6FBF7; color:var(--mint);}
  .badge.cancelled{background:#FBE9E7; color:var(--red);}
  .badge.pending{background:var(--paper); color:var(--steel);}
  .job-service{font-size:16px; font-weight:700; margin-bottom:10px;}
  .job-row{font-size:13.5px; color:var(--steel); margin-bottom:5px;}
  .job-row b{color:var(--ink); font-weight:600;}
  .steps{display:flex; flex-direction:column; gap:6px; margin:12px 0;}
  .step{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--steel-light);}
  .step.done{color:var(--mint);}
  .step.active{color:var(--indigo); font-weight:700;}
  .engineer-box{margin-top:10px; padding:10px 12px; background:var(--indigo-soft); border-radius:8px;}
  .engineer-box--pending{background:var(--paper); color:var(--steel); font-size:12.5px;}
  .engineer-name{font-weight:600; font-size:13px;}
  .engineer-call{display:inline-block; margin-top:4px; font-size:12.5px; color:var(--teal); font-weight:600;}
  .live-map{ height:180px; border-radius:8px; margin-top:10px; overflow:hidden; }
  .final-bill-view{margin-top:10px; padding:12px; background:var(--paper); border:1px solid var(--line); border-radius:8px;}
  .final-bill-view .fb-title{font-size:12.5px; font-weight:700; margin-bottom:6px;}
  .final-bill-view .fb-row{display:flex; justify-content:space-between; font-size:12.5px; color:var(--steel); padding:3px 0;}
  .final-bill-view .fb-row-total{display:flex; justify-content:space-between; font-size:13px; font-weight:700; color:var(--ink); border-top:1px solid var(--line); margin-top:6px; padding-top:8px;}
  .map-pin{
    background:#fff; border:2px solid var(--indigo); border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:13px;
    box-shadow:0 2px 6px rgba(0,0,0,0.25);
  }
  .map-pin--home{ border-color:var(--teal); }
  .empty{padding:60px 20px; text-align:center; color:var(--steel-light); font-size:14px;}
</style>
</head>
<body>

<div id="auth-view">
  <div class="auth-card">

    <div id="phone-step">
      <h1>Login / Sign Up</h1>
      <p class="sub">Apna phone number daalo, hum OTP bhejenge — naya number ho to account bhi ban jayega.</p>
      <div class="field">
        <label for="phone-input">Phone Number</label>
        <div class="phone-row">
          <span class="phone-prefix">+91</span>
          <input type="tel" id="phone-input" placeholder="98765 43210" maxlength="10" inputmode="numeric" style="flex:1;">
        </div>
      </div>
      <button class="btn" id="send-otp-btn">Send OTP</button>
      <p class="msg err" id="phone-error"></p>
    </div>

    <div id="otp-step" style="display:none;">
      <h1>Enter OTP</h1>
      <p class="sub" id="otp-sub"></p>
      <div class="field">
        <label for="otp-input">6-digit OTP</label>
        <input type="text" id="otp-input" placeholder="123456" maxlength="6" inputmode="numeric">
      </div>
      <button class="btn" id="verify-otp-btn">Verify &amp; Continue</button>
      <p class="msg err" id="otp-error"></p>
      <a href="#" class="change-link" id="change-number-link">Change number</a>
    </div>

    <div id="name-step" style="display:none;">
      <h1>What's your name?</h1>
      <p class="sub">Taaki hum aapko sahi se pehchan sakein.</p>
      <div class="field">
        <label for="name-input">Full Name</label>
        <input type="text" id="name-input" placeholder="Your name">
      </div>
      <div class="field">
        <label for="email-input">Email</label>
        <input type="email" id="email-input" placeholder="you@example.com">
      </div>
      <button class="btn" id="save-name-btn">Continue</button>
      <p class="msg err" id="name-error"></p>
    </div>

    <div id="recaptcha-container"></div>
  </div>
</div>

<div id="dashboard-view">
  <div class="top">
    <div class="logo" style="color:#fff;"><span class="mark"></span>My Bookings</div>
    <div class="who">
      <span id="who-name"></span>
      <button id="signout-btn">Sign Out</button>
    </div>
  </div>

  <div class="wrap" style="padding-top:28px; padding-bottom:40px;">
    <a href="booking.html" class="btn" style="display:block; text-align:center; text-decoration:none; margin-bottom:24px;">+ Book a New Service</a>
    <div id="jobs-list"></div>
    <div class="empty" id="jobs-empty" style="display:none;">Abhi koi booking nahi mili is account se.</div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, RecaptchaVerifier, signInWithPhoneNumber, signOut, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { initializeFirestore, doc, getDoc, setDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA80s9jtewt93rsveqQyXD2xslm1chJuME",
    authDomain: "expertinc-tools.firebaseapp.com",
    projectId: "expertinc-tools",
    storageBucket: "expertinc-tools.firebasestorage.app",
    messagingSenderId: "86282664413",
    appId: "1:86282664413:web:ec3374c7ffe1d99e70de34"
  };

  // Named app so its login session doesn't collide with admin.html / engineer-dashboard.html
  const app = initializeApp(firebaseConfig, "compoter-customer");
  const auth = getAuth(app);
  await setPersistence(auth, browserLocalPersistence);
  const db = initializeFirestore(app, { experimentalAutoDetectLongPolling: true });

  function withTimeout(promise, ms, message){
    return Promise.race([
      promise,
      new Promise((_, reject) => setTimeout(() => reject(new Error(message)), ms))
    ]);
  }

  function normalizePhone(phone){
    return String(phone || '').replace(/\D/g, '').slice(-10);
  }

  function esc(str){
    return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  const STATUS_STEPS = [
    { key: 'pending',     label: 'Booked',              icon: '📝' },
    { key: 'assigned',    label: 'Engineer Assigned',   icon: '🧑‍🔧' },
    { key: 'on_the_way',  label: 'On the Way',          icon: '🚗' },
    { key: 'in_progress', label: 'In Progress',         icon: '🔧' },
    { key: 'completed',   label: 'Completed',           icon: '✅' },
  ];

  // ---------- Phone + OTP auth ----------
  const phoneStep = document.getElementById('phone-step');
  const otpStep = document.getElementById('otp-step');
  const nameStep = document.getElementById('name-step');
  const phoneInput = document.getElementById('phone-input');
  const sendOtpBtn = document.getElementById('send-otp-btn');
  const phoneError = document.getElementById('phone-error');
  const otpInput = document.getElementById('otp-input');
  const verifyOtpBtn = document.getElementById('verify-otp-btn');
  const otpError = document.getElementById('otp-error');
  const otpSub = document.getElementById('otp-sub');
  const changeNumberLink = document.getElementById('change-number-link');
  const nameInput = document.getElementById('name-input');
  const emailInput = document.getElementById('email-input');
  const saveNameBtn = document.getElementById('save-name-btn');
  const nameError = document.getElementById('name-error');

  function showStep(step){
    [phoneStep, otpStep, nameStep].forEach(s => s.style.display = 'none');
    step.style.display = 'block';
  }

  let recaptchaVerifier = null;
  function getRecaptcha(){
    if (!recaptchaVerifier) {
      recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', { size: 'invisible' });
    }
    return recaptchaVerifier;
  }

  let confirmationResult = null;

  sendOtpBtn.addEventListener('click', async () => {
    const digits = phoneInput.value.replace(/\D/g, '');
    phoneError.classList.remove('show');
    if (digits.length !== 10) {
      phoneError.textContent = 'Sahi 10-digit phone number daalein.';
      phoneError.classList.add('show');
      return;
    }
    sendOtpBtn.disabled = true;
    sendOtpBtn.textContent = 'Sending...';
    try {
      const fullNumber = '+91' + digits;
      confirmationResult = await signInWithPhoneNumber(auth, fullNumber, getRecaptcha());
      otpSub.textContent = fullNumber + ' par OTP bheja gaya hai.';
      otpInput.value = '';
      showStep(otpStep);
      otpInput.focus();
    } catch (err) {
      console.error(err);
      phoneError.textContent = 'OTP bhejne me dikkat (' + (err.code || err.message) + ').';
      phoneError.classList.add('show');
    } finally {
      sendOtpBtn.disabled = false;
      sendOtpBtn.textContent = 'Send OTP';
    }
  });

  changeNumberLink.addEventListener('click', (e) => {
    e.preventDefault();
    otpError.classList.remove('show');
    showStep(phoneStep);
  });

  let justAuthenticated = false;

  verifyOtpBtn.addEventListener('click', async () => {
    const code = otpInput.value.trim();
    otpError.classList.remove('show');
    if (code.length !== 6) {
      otpError.textContent = '6-digit OTP daalein.';
      otpError.classList.add('show');
      return;
    }
    verifyOtpBtn.disabled = true;
    verifyOtpBtn.textContent = 'Verifying...';
    try {
      justAuthenticated = true;
      await withTimeout(confirmationResult.confirm(code), 20000, 'Verify timed out — try again.');
      // onAuthStateChanged takes over from here.
    } catch (err) {
      console.error(err);
      justAuthenticated = false;
      otpError.textContent = 'Galat OTP ya network dikkat (' + (err.code || err.message) + '). Dobara try karo.';
      otpError.classList.add('show');
      verifyOtpBtn.disabled = false;
      verifyOtpBtn.textContent = 'Verify & Continue';
    }
  });

  let pendingUser = null;

  saveNameBtn.addEventListener('click', async () => {
    const name = nameInput.value.trim();
    const email = emailInput.value.trim();
    nameError.classList.remove('show');
    if (!name) {
      nameError.textContent = 'Naam daalein.';
      nameError.classList.add('show');
      return;
    }
    if (!email || !email.includes('@')) {
      nameError.textContent = 'Sahi email daalein.';
      nameError.classList.add('show');
      return;
    }
    saveNameBtn.disabled = true;
    saveNameBtn.textContent = 'Saving...';
    try {
      await setDoc(doc(db, 'customers', pendingUser.uid), {
        uid: pendingUser.uid,
        name,
        email,
        phone: pendingUser.phoneNumber,
        phoneKey: normalizePhone(pendingUser.phoneNumber),
        createdAt: new Date().toISOString()
      });
      window.location.replace('index.html');
      return;
    } catch (err) {
      console.error(err);
      nameError.textContent = 'Kuch gadbad ho gayi (' + (err.code || err.message) + ').';
      nameError.classList.add('show');
      saveNameBtn.disabled = false;
      saveNameBtn.textContent = 'Continue';
    }
  });

  // ---------- Dashboard ----------
  const authView = document.getElementById('auth-view');
  const dashboardView = document.getElementById('dashboard-view');
  const whoName = document.getElementById('who-name');
  const jobsList = document.getElementById('jobs-list');
  const jobsEmpty = document.getElementById('jobs-empty');

  document.getElementById('signout-btn').addEventListener('click', () => signOut(auth));

  const bookingUnsubs = {}; // bookingNumber -> unsub
  let bookingsMap = {};     // bookingId -> data
  const liveMaps = {};      // bookingId -> { map, marker }

  function stopAllTracking(){
    Object.values(bookingUnsubs).forEach(u => u());
    Object.keys(bookingUnsubs).forEach(k => delete bookingUnsubs[k]);
    bookingsMap = {};
    Object.keys(liveMaps).forEach(k => delete liveMaps[k]);
  }

  onAuthStateChanged(auth, async (user) => {
    stopAllTracking();

    if (!user) {
      authView.style.display = 'flex';
      dashboardView.style.display = 'none';
      showStep(phoneStep);
      verifyOtpBtn.disabled = false; verifyOtpBtn.textContent = 'Verify & Continue';
      sendOtpBtn.disabled = false; sendOtpBtn.textContent = 'Send OTP';
      document.body.style.visibility = 'visible';
      return;
    }

    let custSnap;
    try {
      custSnap = await withTimeout(getDoc(doc(db, 'customers', user.uid)), 20000, 'Profile load timed out.');
    } catch (err) {
      console.error('customer profile lookup failed', err);
      const alreadyRetried = sessionStorage.getItem('cptr-profile-retry') === '1';
      otpError.textContent = alreadyRetried
        ? 'Profile load nahi ho pa raha (' + (err.code || err.message) + '). Firestore rules check karein.'
        : 'Login ho gaya, lekin profile load karne me dikkat (' + (err.code || err.message) + '). Dobara try ho raha hai...';
      otpError.classList.add('show');
      showStep(otpStep);
      if (!alreadyRetried) {
        sessionStorage.setItem('cptr-profile-retry', '1');
        setTimeout(() => window.location.reload(), 2000);
      }
      return;
    }
    sessionStorage.removeItem('cptr-profile-retry');

    if (!custSnap.exists()) {
      pendingUser = user;
      authView.style.display = 'flex';
      dashboardView.style.display = 'none';
      nameError.classList.remove('show');
      saveNameBtn.disabled = false; saveNameBtn.textContent = 'Continue';
      showStep(nameStep);
      document.body.style.visibility = 'visible';
      return;
    }

    if (justAuthenticated) {
      justAuthenticated = false;
      window.location.replace('index.html');
      return;
    }
    await loadDashboard(user, custSnap.data().name);
  });

  let appChromeLoaded = false;
  function loadAppChrome(){
    if (appChromeLoaded) return;
    appChromeLoaded = true;
    const tabs = document.createElement('script');
    tabs.src = 'app-tabs.js';
    document.body.appendChild(tabs);
    const bot = document.createElement('script');
    bot.type = 'module';
    bot.src = 'chatbot.js';
    document.body.appendChild(bot);
  }

  async function loadDashboard(user, name){
    loadAppChrome();
    whoName.textContent = name || user.phoneNumber;
    authView.style.display = 'none';
    dashboardView.style.display = 'block';
    document.body.style.visibility = 'visible';

    const phoneKey = normalizePhone(user.phoneNumber);
    if (!phoneKey) return;

    try {
      const idxSnap = await getDoc(doc(db, 'bookingsByPhone', phoneKey));
      const numbers = idxSnap.exists() ? (idxSnap.data().bookingNumbers || []) : [];
      numbers.forEach(num => {
        if (bookingUnsubs[num]) return;
        bookingUnsubs[num] = onSnapshot(doc(db, 'bookings', num), (snap) => {
          if (snap.exists()) {
            bookingsMap[snap.id] = { id: snap.id, ...snap.data() };
            renderAll();
          }
        });
      });
    } catch (err) {
      console.error('phone bookings lookup failed', err);
    }
  }

  function statusLabel(key){
    const s = STATUS_STEPS.find(s => s.key === key);
    if (s) return s.label;
    if (key === 'cancelled') return 'Cancelled';
    return 'Pending';
  }

  async function ensureLeaflet(){
    if (window.L) return;
    await new Promise(resolve => {
      if (window.L) { resolve(); return; }
      const check = setInterval(() => { if (window.L) { clearInterval(check); resolve(); } }, 100);
    });
  }

  async function renderLiveMap(b){
    const showMap = (b.status === 'on_the_way' || b.status === 'in_progress') && b.engineerLocation;
    const containerId = 'cust-map-' + b.id;
    const el = document.getElementById(containerId);
    if (!el || !showMap) return;

    await ensureLeaflet();
    const engPos = [b.engineerLocation.lat, b.engineerLocation.lng];

    if (!liveMaps[b.id]) {
      const map = L.map(containerId, { scrollWheelZoom: false }).setView(engPos, 13);
      map.on('focus', () => map.scrollWheelZoom.enable());
      map.on('blur', () => map.scrollWheelZoom.disable());
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors', maxZoom: 19,
      }).addTo(map);
      const marker = L.marker(engPos, {
        icon: L.divIcon({ html: '🧑‍🔧', className: 'map-pin', iconSize: [26, 26] })
      }).addTo(map);
      if (b.location) {
        L.marker([b.location.lat, b.location.lng], {
          icon: L.divIcon({ html: '📍', className: 'map-pin map-pin--home', iconSize: [26, 26] })
        }).addTo(map);
        map.fitBounds([engPos, [b.location.lat, b.location.lng]], { padding: [20, 20] });
      }
      liveMaps[b.id] = { map, marker };
    } else {
      liveMaps[b.id].marker.setLatLng(engPos);
      liveMaps[b.id].map.panTo(engPos);
    }
  }

  function buildCardHTML(b){
    if (b.status === 'cancelled') {
      return `<div class="job-card">
        <div class="job-top"><span class="job-id">${esc(b.bookingNumber)}</span><span class="badge cancelled">Cancelled</span></div>
        <div class="job-service">${esc(b.service)}</div>
      </div>`;
    }

    let idx = STATUS_STEPS.findIndex(s => s.key === b.status);
    if (idx < 0) idx = 0;

    const steps = STATUS_STEPS.map((s, i) => `
      <div class="step ${i < idx ? 'done' : i === idx ? 'active' : ''}">
        <span>${s.icon}</span><span>${esc(s.label)}</span>
      </div>`).join('');

    const engineerHTML = b.assignedEngineer
      ? `<div class="engineer-box">
           <div class="engineer-name">🧑‍🔧 ${esc(b.assignedEngineer)}</div>
           ${b.assignedEngineerPhone ? `<a class="engineer-call" href="tel:${esc(b.assignedEngineerPhone)}">📞 Call Engineer</a>` : ''}
         </div>`
      : `<div class="engineer-box engineer-box--pending">Engineer jald hi assign kiya jayega.</div>`;

    const showMap = (b.status === 'on_the_way' || b.status === 'in_progress');
    const mapHTML = showMap ? `<div class="live-map" id="cust-map-${esc(b.id)}"></div>` : '';

    const finalBillHTML = (b.finalBillItems && b.finalBillItems.length)
      ? `<div class="final-bill-view">
           <div class="fb-title">💰 Final Bill</div>
           ${b.finalBillItems.map(i => `<div class="fb-row"><span>${esc(i.name)}</span><span>₹${Number(i.price).toLocaleString('en-IN')}</span></div>`).join('')}
           <div class="fb-row-total"><span>Total</span><span>₹${Number(b.finalBillTotal || 0).toLocaleString('en-IN')}</span></div>
         </div>`
      : '';

    return `<div class="job-card">
      <div class="job-top">
        <span class="job-id">${esc(b.bookingNumber)}</span>
        <span class="badge ${esc(b.status)}">${esc(statusLabel(b.status))}</span>
      </div>
      <div class="job-service">${esc(b.service)}</div>
      <div class="job-row"><b>Location:</b> ${esc(b.city)}</div>
      <div class="job-row"><b>Preferred:</b> ${esc(b.date || 'Any date')} — ${esc(b.time || '')}</div>
      <div class="steps">${steps}</div>
      ${engineerHTML}
      ${mapHTML}
      ${finalBillHTML}
    </div>`;
  }

  function renderAll(){
    const bookings = Object.values(bookingsMap).sort((a, b) =>
      (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0)
    );

    if (!bookings.length) {
      jobsList.innerHTML = '';
      jobsEmpty.style.display = 'block';
      return;
    }
    jobsEmpty.style.display = 'none';

    jobsList.innerHTML = bookings.map(buildCardHTML).join('');

    // The list above just replaced the DOM, so any previously-bound Leaflet
    // maps are now attached to detached nodes — properly dispose each one
    // (map.remove() tears down its event listeners/tiles) before dropping
    // the reference, otherwise they leak and the page grinds to a halt after
    // a few live-location updates.
    Object.keys(liveMaps).forEach(k => {
      try { liveMaps[k].map.remove(); } catch (e) {}
      delete liveMaps[k];
    });
    bookings.forEach(b => renderLiveMap(b));
  }
</script>
