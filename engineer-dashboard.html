<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Engineer Dashboard — Compoter</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
  :root{
    --paper:#F8F9FC; --paper-raised:#FFFFFF; --ink:#101820;
    --indigo:#3730A3; --indigo-deep:#211D5C; --indigo-soft:#EDECFB;
    --teal:#14B8A6; --mint:#1F8A70; --red:#D6362C; --amber:#B45309; --amber-soft:#FEF3C7;
    --steel:#57677A; --steel-light:#8A96A3; --line:#E2E6E4;
    --display:'Space Grotesk', sans-serif; --body:'Inter', sans-serif; --mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--paper); color:var(--ink); font-family:var(--body); line-height:1.5;}
  a{color:inherit;}
  h1,h2{font-family:var(--display); font-weight:700;}

  .top{background:var(--indigo-deep); color:#fff; padding:16px 28px; display:flex; align-items:center; justify-content:space-between;}
  .top .logo{font-family:var(--display); font-weight:700; font-size:17px; display:flex; align-items:center; gap:10px;}
  .top .logo .mark{width:26px; height:26px; background:var(--teal); border-radius:6px;}
  .top .who{font-size:13px; color:#C6C2ED; display:flex; align-items:center; gap:14px;}
  .top button{background:rgba(255,255,255,0.12); color:#fff; border:none; padding:8px 14px; border-radius:7px; cursor:pointer; font-size:13px; font-weight:600;}
  .top button:hover{background:rgba(255,255,255,0.22);}

  .wrap{max-width:760px; margin:0 auto; padding:28px;}

  /* LOGIN */
  #login-view{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  .login-card{background:var(--paper-raised); border:1px solid var(--line); border-radius:14px; padding:36px; width:100%; max-width:380px;}
  .login-card h1{font-size:22px; margin-bottom:6px;}
  .login-card p.sub{color:var(--steel); font-size:13.5px; margin-bottom:24px;}
  .field{margin-bottom:16px;}
  .field label{font-size:13px; font-weight:600; display:block; margin-bottom:6px;}
  .field input{
    width:100%; background:var(--paper); border:1.5px solid var(--line); border-radius:8px; padding:11px 13px;
    font-family:var(--body); font-size:14px; color:var(--ink); outline:none;
  }
  .field input:focus{border-color:var(--indigo);}
  .btn{
    font-family:var(--body); font-weight:600; font-size:14.5px; padding:12px 20px; border-radius:8px;
    cursor:pointer; border:none; width:100%; background:var(--teal); color:#fff;
  }
  .btn:hover{background:#0D9488;}
  .btn:disabled{opacity:0.6; cursor:not-allowed;}
  .msg{font-size:13px; margin-top:12px; padding:10px 12px; border-radius:7px; display:none;}
  .msg.show{display:block;}
  .msg.err{background:#FBE9E7; color:var(--red);}
  .msg.info{background:var(--indigo-soft); color:var(--indigo);}

  /* DASHBOARD */
  #dashboard-view{display:none;}
  .pending-banner{
    background:var(--amber-soft); color:var(--amber); padding:14px 18px; border-radius:10px;
    font-size:13.5px; font-weight:600; margin-bottom:20px; display:none;
  }
  .pending-banner.show{display:block;}

  .job-card{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:14px; padding:22px; margin-bottom:16px;
  }
  .job-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; gap:8px;}
  .job-id{font-family:var(--mono); font-weight:700; font-size:14px; color:var(--indigo);}
  .badge{display:inline-block; font-size:11px; font-weight:700; padding:4px 11px; border-radius:100px; text-transform:capitalize;}
  .badge.assigned{background:var(--indigo-soft); color:var(--indigo);}
  .badge.on_the_way{background:#FEF3C7; color:var(--amber);}
  .badge.in_progress{background:#E0F2FE; color:#0369A1;}
  .badge.completed{background:#E6FBF7; color:var(--mint);}
  .badge.cancelled{background:#FBE9E7; color:var(--red);}
  .job-service{font-size:16px; font-weight:700; margin-bottom:10px;}
  .job-row{font-size:13.5px; color:var(--steel); margin-bottom:5px;}
  .job-row b{color:var(--ink); font-weight:600;}
  .job-desc{
    background:var(--paper); border-radius:8px; padding:10px 12px; font-size:13px; color:var(--ink);
    margin:12px 0; white-space:pre-wrap;
  }
  .job-actions{display:flex; gap:10px; margin-top:14px; flex-wrap:wrap;}
  .action-btn{
    font-family:var(--body); font-weight:700; font-size:13.5px; padding:11px 18px; border-radius:8px;
    cursor:pointer; border:none; background:var(--teal); color:#fff;
  }
  .action-btn:hover{background:#0D9488;}
  .action-btn:disabled{opacity:0.6; cursor:not-allowed;}
  .call-link{
    font-weight:700; font-size:13.5px; padding:11px 18px; border-radius:8px; background:var(--indigo-soft); color:var(--indigo);
    text-decoration:none; display:inline-block;
  }

  .empty{padding:60px 20px; text-align:center; color:var(--steel-light); font-size:14px;}
</style>
</head>
<body>
