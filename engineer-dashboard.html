<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Engineer Dashboard — Compoter</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
  :root{
    --paper:#F8F9FC; --paper-raised:#FFFFFF; --ink:#101820;
    --indigo:#3730A3; --indigo-deep:#211D5C; --indigo-soft:#EDECFB;
    --teal:#14B8A6; --mint:#1F8A70; --red:#D6362C; --amber:#B45309; --amber-soft:#FEF3C7;
    --steel:#57677A; --steel-light:#8A96A3; --line:#E2E6E4;
    --display:'Space Grotesk', sans-serif; --body:'Inter', sans-serif; --mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--paper); color:var(--ink); font-family:var(--body); line-height:1.5;}
  a{color:inherit;}
  h1,h2{font-family:var(--display); font-weight:700;}

  .top{background:var(--indigo-deep); color:#fff; padding:16px 28px; display:flex; align-items:center; justify-content:space-between;}
  .top .logo{font-family:var(--display); font-weight:700; font-size:17px; display:flex; align-items:center; gap:10px;}
  .top .logo .mark{width:26px; height:26px; background:var(--teal); border-radius:6px;}
  .top .who{font-size:13px; color:#C6C2ED; display:flex; align-items:center; gap:14px;}
  .top button{background:rgba(255,255,255,0.12); color:#fff; border:none; padding:8px 14px; border-radius:7px; cursor:pointer; font-size:13px; font-weight:600;}
  .top button:hover{background:rgba(255,255,255,0.22);}

  .wrap{max-width:760px; margin:0 auto; padding:28px;}

  /* LOGIN */
  #login-view{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  .login-card{background:var(--paper-raised); border:1px solid var(--line); border-radius:14px; padding:36px; width:100%; max-width:380px;}
  .login-card h1{font-size:22px; margin-bottom:6px;}
  .login-card p.sub{color:var(--steel); font-size:13.5px; margin-bottom:24px;}
  .field{margin-bottom:16px;}
  .field label{font-size:13px; font-weight:600; display:block; margin-bottom:6px;}
  .field input{
    width:100%; background:var(--paper); border:1.5px solid var(--line); border-radius:8px; padding:11px 13px;
    font-family:var(--body); font-size:14px; color:var(--ink); outline:none;
  }
  .field input:focus{border-color:var(--indigo);}
  .btn{
    font-family:var(--body); font-weight:600; font-size:14.5px; padding:12px 20px; border-radius:8px;
    cursor:pointer; border:none; width:100%; background:var(--teal); color:#fff;
  }
  .btn:hover{background:#0D9488;}
  .btn:disabled{opacity:0.6; cursor:not-allowed;}
  .msg{font-size:13px; margin-top:12px; padding:10px 12px; border-radius:7px; display:none;}
  .msg.show{display:block;}
  .msg.err{background:#FBE9E7; color:var(--red);}
  .msg.info{background:var(--indigo-soft); color:var(--indigo);}

  /* DASHBOARD */
  #dashboard-view{display:none;}
  .pending-banner{
    background:var(--amber-soft); color:var(--amber); padding:14px 18px; border-radius:10px;
    font-size:13.5px; font-weight:600; margin-bottom:20px; display:none;
  }
  .pending-banner.show{display:block;}

  .job-card{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:14px; padding:22px; margin-bottom:16px;
  }
  .job-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; gap:8px;}
  .job-id{font-family:var(--mono); font-weight:700; font-size:14px; color:var(--indigo);}
  .badge{display:inline-block; font-size:11px; font-weight:700; padding:4px 11px; border-radius:100px; text-transform:capitalize;}
  .badge.assigned{background:var(--indigo-soft); color:var(--indigo);}
  .badge.on_the_way{background:#FEF3C7; color:var(--amber);}
  .badge.in_progress{background:#E0F2FE; color:#0369A1;}
  .badge.completed{background:#E6FBF7; color:var(--mint);}
  .badge.cancelled{background:#FBE9E7; color:var(--red);}
  .job-service{font-size:16px; font-weight:700; margin-bottom:10px;}
  .job-row{font-size:13.5px; color:var(--steel); margin-bottom:5px;}
  .job-row b{color:var(--ink); font-weight:600;}
  .job-desc{
    background:var(--paper); border-radius:8px; padding:10px 12px; font-size:13px; color:var(--ink);
    margin:12px 0; white-space:pre-wrap;
  }
  .job-actions{display:flex; gap:10px; margin-top:14px; flex-wrap:wrap;}
  .action-btn{
    font-family:var(--body); font-weight:700; font-size:13.5px; padding:11px 18px; border-radius:8px;
    cursor:pointer; border:none; background:var(--teal); color:#fff;
  }
  .action-btn:hover{background:#0D9488;}
  .action-btn:disabled{opacity:0.6; cursor:not-allowed;}
  .call-link{
    font-weight:700; font-size:13.5px; padding:11px 18px; border-radius:8px; background:var(--indigo-soft); color:var(--indigo);
    text-decoration:none; display:inline-block;
  }

  .empty{padding:60px 20px; text-align:center; color:var(--steel-light); font-size:14px;}
</style>
</head>
<body>

<div id="login-view">
  <div class="login-card">
    <h1>Engineer Login</h1>
    <p class="sub">Wahi email/password jo registration ke waqt banaya tha.</p>
    <form id="login-form">
      <div class="field"><label for="l-email">Email</label><input type="email" id="l-email" required placeholder="you@email.com"></div>
      <div class="field"><label for="l-password">Password</label><input type="password" id="l-password" required placeholder="Password"></div>
      <button type="submit" class="btn" id="login-btn">Sign In</button>
      <p class="msg err" id="login-error"></p>
    </form>
  </div>
</div>

<div id="dashboard-view">
  <div class="top">
    <div class="logo"><span class="mark"></span>My Jobs</div>
    <div class="who">
      <span id="who-name"></span>
      <button id="signout-btn">Sign Out</button>
    </div>
  </div>

  <div class="wrap">
    <div class="pending-banner" id="pending-banner">
      Aapka account abhi verify ho raha hai — jab Compoter team approve kar degi, tab aapko jobs milni shuru hongi.
    </div>
    <div id="jobs-list"></div>
    <div class="empty" id="jobs-empty" style="display:none;">Abhi koi job assign nahi hui hai.</div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, updateDoc, collection, query, where, onSnapshot, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA80s9jtewt93rsveqQyXD2xslm1chJuME",
    authDomain: "expertinc-tools.firebaseapp.com",
    projectId: "expertinc-tools",
    storageBucket: "expertinc-tools.firebasestorage.app",
    messagingSenderId: "86282664413",
    appId: "1:86282664413:web:ec3374c7ffe1d99e70de34"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  emailjs.init({ publicKey: "mMqKhug76RFv2VLxB" });

  const STATUS_FLOW = {
    assigned:    { next: 'on_the_way',  label: '✅ Accept — On the Way' },
    on_the_way:  { next: 'in_progress', label: '🔧 Start Job' },
    in_progress: { next: 'completed',   label: '✔️ Mark Completed' }
  };

  const STATUS_LABELS = {
    pending: 'Pending', assigned: 'Assigned', on_the_way: 'On the Way',
    in_progress: 'In Progress', completed: 'Completed', cancelled: 'Cancelled'
  };

  function esc(str){
    return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function notifyClientEmail(booking, statusKey){
    if (!booking.email) return;
    const message = `Aapki booking ka status update hua hai:\n\n`
      + `Booking: ${booking.bookingNumber}\nService: ${booking.service}\n`
      + `Naya Status: ${STATUS_LABELS[statusKey] || statusKey}\n`
      + (booking.assignedEngineer ? `Engineer: ${booking.assignedEngineer}${booking.assignedEngineerPhone ? ' (' + booking.assignedEngineerPhone + ')' : ''}\n` : '')
      + `\n- Compoter Team`;
    emailjs.send("service_p4lpxi5", "template_6k9mcnh", {
      to_name: booking.name,
      to_email: booking.email,
      reply_message: message,
      ticket_number: booking.bookingNumber
    }).catch(err => console.error('Client notification email failed:', err));
  }

  const loginView = document.getElementById('login-view');
  const dashboardView = document.getElementById('dashboard-view');
  const loginForm = document.getElementById('login-form');
  const loginBtn = document.getElementById('login-btn');
  const loginError = document.getElementById('login-error');
  const whoName = document.getElementById('who-name');
  const pendingBanner = document.getElementById('pending-banner');
  const jobsList = document.getElementById('jobs-list');
  const jobsEmpty = document.getElementById('jobs-empty');

  function showLoginError(text){
    loginError.textContent = text;
    loginError.classList.add('show');
  }

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    loginBtn.disabled = true;
    loginBtn.textContent = 'Signing in...';
    loginError.classList.remove('show');
    try {
      await signInWithEmailAndPassword(auth, document.getElementById('l-email').value.trim(), document.getElementById('l-password').value);
    } catch (err) {
      console.error(err);
      showLoginError('Invalid email or password.');
      loginBtn.disabled = false;
      loginBtn.textContent = 'Sign In';
    }
  });

  document.getElementById('signout-btn').addEventListener('click', () => signOut(auth));

  let jobsUnsub = null;

  onAuthStateChanged(auth, async (user) => {
    if (jobsUnsub) { jobsUnsub(); jobsUnsub = null; }

    if (!user) {
      loginView.style.display = 'flex';
      dashboardView.style.display = 'none';
      loginBtn.disabled = false;
      loginBtn.textContent = 'Sign In';
      return;
    }

    let engSnap;
    try {
      engSnap = await getDocs(query(collection(db, 'engineers'), where('uid', '==', user.uid)));
    } catch (err) {
      console.error(err);
      showLoginError('Lookup failed (' + (err.code || err.message) + '). UID: ' + user.uid);
      await signOut(auth);
      return;
    }
    if (engSnap.empty) {
      showLoginError('Engineer record not found. UID checked: ' + user.uid);
      await signOut(auth);
      return;
    }

    const engineer = engSnap.docs[0].data();
    whoName.textContent = engineer.name || user.email;
    pendingBanner.classList.toggle('show', engineer.status !== 'active');

    loginView.style.display = 'none';
    dashboardView.style.display = 'block';

    jobsUnsub = onSnapshot(
      query(collection(db, 'bookings'), where('assignedEngineerUid', '==', user.uid)),
      (snap) => {
        currentJobs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        currentJobs.sort((a, b) => (b.updatedAt?.toMillis?.() || 0) - (a.updatedAt?.toMillis?.() || 0));
        renderJobs(currentJobs);
      },
      err => console.error('jobs listen failed', err)
    );
  });

  let currentJobs = [];

  function renderJobs(jobs){
    if (!jobs.length) {
      jobsList.innerHTML = '';
      jobsEmpty.style.display = 'block';
      return;
    }
    jobsEmpty.style.display = 'none';

    jobsList.innerHTML = jobs.map(b => {
      const flow = STATUS_FLOW[b.status];
      const actionBtn = flow
        ? `<button class="action-btn" data-booking="${esc(b.id)}" data-next="${flow.next}">${flow.label}</button>`
        : '';
      const callLink = b.phone
        ? `<a class="call-link" href="tel:${esc(b.phone)}">📞 Call Customer</a>`
        : '';

      return `<div class="job-card">
        <div class="job-top">
          <span class="job-id">${esc(b.bookingNumber)}</span>
          <span class="badge ${esc(b.status)}">${esc(STATUS_LABELS[b.status] || b.status)}</span>
        </div>
        <div class="job-service">${esc(b.service)}</div>
        <div class="job-row"><b>Customer:</b> ${esc(b.name)} (${esc(b.phone)})</div>
        <div class="job-row"><b>Location:</b> ${esc(b.city)}</div>
        <div class="job-row"><b>Address:</b> ${esc(b.address)}</div>
        <div class="job-row"><b>Preferred:</b> ${esc(b.date || 'Any date')} — ${esc(b.time || '')}</div>
        <div class="job-desc">${esc(b.description)}</div>
        <div class="job-actions">${actionBtn}${callLink}</div>
      </div>`;
    }).join('');
  }

  jobsList.addEventListener('click', async (e) => {
    const btn = e.target.closest('.action-btn');
    if (!btn) return;
    btn.disabled = true;
    const bookingId = btn.dataset.booking;
    const nextStatus = btn.dataset.next;
    const booking = currentJobs.find(j => j.id === bookingId);
    try {
      await updateDoc(doc(db, 'bookings', bookingId), { status: nextStatus, updatedAt: serverTimestamp() });
      if (booking) notifyClientEmail(booking, nextStatus);
    } catch (err) {
      console.error('Status update failed:', err);
      btn.disabled = false;
    }
  });
</script>

</body>
</html>
